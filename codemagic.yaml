workflows:
  ios-release:
    name: iOS Production Build
    max_build_duration: 60
    instance_type: mac_mini_m2
    integrations:
      app_store_connect: FUN MOMENT Codemagic
    environment:
      ios_signing:
        provisioning_profiles:
          - fun_moment_app_store_caps
      flutter: stable
      xcode: latest
      cocoapods: default
    scripts:
      - name: Set up code signing settings on Xcode project
        script: |
          xcode-project use-profiles
      - name: Get Flutter dependencies
        script: |
          flutter pub get
      - name: Install CocoaPods dependencies
        script: |
          cd ios
          pod install
      - name: Run Flutter Analyze
        script: |
          flutter analyze --no-fatal-infos || true
      - name: Build Flutter iOS Application
        script: |
          flutter build ipa --release --dart-define=BASE_API=https://bkfunmoments.unifinitylab.com/api/v1
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
        submit_to_app_store: false

  android-release:
    name: Android Production Build
    max_build_duration: 60
    instance_type: mac_mini_m2
    environment:
      flutter: stable
      java: 17
    scripts:
      - name: Get Flutter dependencies
        script: |
          flutter pub get
      - name: Run Flutter Analyze
        script: |
          flutter analyze --no-fatal-infos || true
      - name: Build Android Release APK
        script: |
          flutter build apk --release --no-tree-shake-icons --dart-define=BASE_API=https://bkfunmoments.unifinitylab.com/api/v1
    artifacts:
      - build/app/outputs/flutter-apk/*.apk
