workflows:
  ios-release:
    name: iOS Production Build
    max_build_duration: 60
    instance_type: mac_mini_m2
    environment:
      flutter: stable
      xcode: latest
      cocoapods: default
    scripts:
      - name: Set up keychain and code signing if configured
        script: |
          if [ -n "$CERT_PASSWORD" ]; then
            keychain initialize
            app-store-connect fetch-signing-files "$BUNDLE_ID" \
              --type IOS_APP_STORE \
              --create
            keychain add-certificates
            xcode-project use-profiles
          fi
      - name: Get Flutter dependencies
        script: |
          flutter pub get
      - name: Install CocoaPods dependencies
        script: |
          cd ios && pod install
      - name: Run Flutter Analyze
        script: |
          flutter analyze --no-fatal-infos || true
      - name: Build Flutter iOS Application
        script: |
          if [ -n "$CERT_PASSWORD" ]; then
            flutter build ipa --release --dart-define=BASE_API=https://bkfunmoments.unifinitylab.com/api/v1
          else
            flutter build ios --release --no-codesign --dart-define=BASE_API=https://bkfunmoments.unifinitylab.com/api/v1
          fi
    artifacts:
      - build/ios/ipa/*.ipa
      - build/ios/iphoneos/Runner.app
      - /tmp/xcodebuild_logs/*.log

  android-release:
    name: Android Production Build
    max_build_duration: 60
    instance_type: mac_mini_m2
    environment:
      flutter: stable
      java: 17
    scripts:
      - name: Get Flutter dependencies
        script: |
          flutter pub get
      - name: Run Flutter Analyze
        script: |
          flutter analyze --no-fatal-infos || true
      - name: Build Android Release APK
        script: |
          flutter build apk --release --no-tree-shake-icons --dart-define=BASE_API=https://bkfunmoments.unifinitylab.com/api/v1
    artifacts:
      - build/app/outputs/flutter-apk/*.apk
