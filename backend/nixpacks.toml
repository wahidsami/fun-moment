[phases.setup]
nixPkgs = ["...", "ffmpeg"]

[start]
cmd = "mkdir -p public/assets/uploads/media-uploader storage/framework/cache/data storage/framework/sessions storage/framework/views storage/logs storage/app/public/music_covers storage/app/music_private/masters storage/app/music_private/streams storage/app/music_private/previews bootstrap/cache && { chmod -R ug+rwX storage bootstrap/cache 2>/dev/null || true; } && { if [ -e public/storage ] && [ ! -L public/storage ]; then echo 'FATAL: public/storage is a real directory or file, not a symlink! Refusing to delete or overwrite.' >&2; exit 1; fi; } && ln -sfn /app/storage/app/public public/storage && test -L public/storage && php -d upload_max_filesize=32M -d post_max_size=32M -d memory_limit=256M -S 0.0.0.0:80 -t public server.php"
